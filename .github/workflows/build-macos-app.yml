name: Build macOS App

on:
  push:
    branches:
      - main
    paths:
      - "mac-app/**"
      - ".github/workflows/build-macos-app.yml"
  pull_request:
    paths:
      - "mac-app/**"
      - ".github/workflows/build-macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build downloadable macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        working-directory: mac-app
        run: swift test

      - name: Build app
        working-directory: mac-app
        run: ./build-app.sh

      - name: Package app
        working-directory: mac-app/dist
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "Total Image Asset Classifier.app" \
            "Total-Image-Asset-Classifier-macOS.zip"
          shasum -a 256 "Total-Image-Asset-Classifier-macOS.zip" \
            > "Total-Image-Asset-Classifier-macOS.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Total-Image-Asset-Classifier-macOS
          path: |
            mac-app/dist/Total-Image-Asset-Classifier-macOS.zip
            mac-app/dist/Total-Image-Asset-Classifier-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.0"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "mac-app/dist/Total-Image-Asset-Classifier-macOS.zip" \
              "mac-app/dist/Total-Image-Asset-Classifier-macOS.zip.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "mac-app/dist/Total-Image-Asset-Classifier-macOS.zip" \
              "mac-app/dist/Total-Image-Asset-Classifier-macOS.zip.sha256" \
              --target "${GITHUB_SHA}" \
              --title "Total Image Asset Classifier v0.3.0" \
              --notes "Adds smart source-to-destination comparison: reuse finalized Model/Product classifications, auto-refresh known replacements, safely map clear renamed products, preserve destination-only outputs, and show only genuinely unresolved source images for manual classification."
          fi
